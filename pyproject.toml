[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ikken"
version = "0.1.0"
description = "Read once, answer many: exact multi-question encoding for ModernBERT-family encoders"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ikken contributors" }]
keywords = ["encoder", "modernbert", "classification", "decision model", "attention mask"]
dependencies = [
    "torch>=2.2",
    "transformers>=5.17,<6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ikken*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
